name: Sync Upstream (detect-only)

# 本仓库是基于上游 xibai6668/Android-AI-gateway 的一次性重新入库（无关历史），
# 无法用 git merge 直接合并上游。此工作流只负责“发现上游有新提交并报告”，
# 不再尝试自动合并、不会因为 tag 同名或历史无关而红灯。
# 真要移植某个上游改动，请人工挑取（cherry-pick / 手动对比）后另开提交。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京时间 03:00

permissions:
  contents: read
  actions: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream (no tags)
        run: |
          set -e
          git remote add upstream https://github.com/xibai6668/Android-AI-gateway.git 2>/dev/null || true
          # 关键：不加 --tags，避免与本地同名 tag（如 v2.38.4）冲突导致 fetch 失败
          git fetch upstream --prune --no-tags

      - name: Report new upstream commits
        run: |
          set -e
          # 无共同祖先，无法用 merge-base 判断，改用“上游历中是否有本地未包含的提交”做近似报告。
          echo "=== 上游 main 最近 20 个提交 ==="
          git log --oneline -20 upstream/main || true
          echo ""
          echo "若需移植，请在本地：git fetch upstream --no-tags，然后按提交逐个 cherry-pick。"
          echo "本工作流不再自动合并（历史无关），因此不会失败。"
