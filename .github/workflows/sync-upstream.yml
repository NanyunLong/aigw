name: Sync Upstream (report-only)

# 本仓库与上游 xibai6668/Android-AI-gateway 是“无关历史”（建仓时整树重新入库）。
# 禁止 git merge（必炸）。此工作流每天只做一件事：
#   以上次同步点（UPSTREAM_LAST_SYNC）为基准，看上游 main 有没有“新的”提交。
#   若有，列出改了哪些文件，并标出哪些落在我们的定制面上。
# 绝不自动合并、绝不会因为无关历史或 tag 同名而红灯。
# 定制面清单见 .github/upstream-protect.txt，说明见 UPSTREAM_BASELINE.md。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'   # UTC 19:00 = 北京时间 03:00

permissions:
  contents: read

concurrency:
  group: sync-upstream
  cancel-in-progress: false

env:
  UPSTREAM_LAST_SYNC: '838fe76410ba132f80a9d6b678b1df0f5e921b65'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch upstream (no tags)
        run: |
          set -e
          git remote add upstream https://github.com/xibai6668/Android-AI-gateway.git 2>/dev/null || true
          git fetch upstream --prune --no-tags

      - name: Report new upstream commits since last sync
        run: |
          set -e
          BASE="$UPSTREAM_LAST_SYNC"
          echo "================================================================"
          echo " last sync : $BASE ($(git log -1 --format='%ci %s' "$BASE" 2>/dev/null || echo 'unknown'))"
          echo " upstream  : $(git log -1 --format='%h %ci %s' upstream/main)"
          echo "================================================================"

          if ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "WARN: baseline commit $BASE not found, please update UPSTREAM_LAST_SYNC."
            exit 0
          fi

          COUNT=$(git rev-list --count "$BASE"..upstream/main)
          if [ "$COUNT" = "0" ]; then
            echo "OK: upstream has no new commits since last sync. Nothing to do."
            exit 0
          fi

          echo "Found $COUNT new upstream commit(s):"
          git log --oneline "$BASE"..upstream/main
          echo ""

          git diff --name-only "$BASE" upstream/main > /tmp/changed.txt || true

          echo "### Changed files upstream:"
          cat /tmp/changed.txt
          echo ""
          echo "### SAFE to follow (not on our customization surface):"
          grep -v -F -f .github/upstream-protect.txt /tmp/changed.txt || true
          echo ""
          echo "### WARNING: touches our customization surface - manual cherry-pick only, never whole-file overwrite:"
          grep -F -f .github/upstream-protect.txt /tmp/changed.txt || true
          echo ""
          echo "Tip: for non-surface files you may 'git checkout upstream/main -- <file>';"
          echo "for surface files, diff manually and take only the needed upstream logic."
          echo "After handling, update UPSTREAM_LAST_SYNC to the latest upstream commit."