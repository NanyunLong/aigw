name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 把 secrets 读进 env，供 if 条件用（GitHub 不允许在 if: 里直接引用 secrets）
      HAS_KEYSTORE: ${{ secrets.AIGW_KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 用 action 提供 gradle 命令，仓库里就不需要放 wrapper 的二进制 jar
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Install SDK platform + build-tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.AIGW_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/aigw.jks"

      # 配了签名密钥 → 打已签名 release；没配 → 打 debug（debug 签名自动生成，可直接安装）
      - name: Build signed release
        if: env.HAS_KEYSTORE == 'true'
        env:
          AIGW_KEYSTORE: ${{ runner.temp }}/aigw.jks
          AIGW_STORE_PASSWORD: ${{ secrets.AIGW_STORE_PASSWORD }}
          AIGW_KEY_ALIAS: ${{ secrets.AIGW_KEY_ALIAS }}
          AIGW_KEY_PASSWORD: ${{ secrets.AIGW_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Build debug
        if: env.HAS_KEYSTORE != 'true'
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          find . -name "*.apk" -path "*/build/outputs/*" -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: aigw-apk
          path: out/*.apk
          retention-days: 30
