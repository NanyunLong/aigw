name: Android Release

# 仅手动触发：只有在明确需要 release 包时才在云端构建并直接发版。
# 本地不产出任何包；发版包统一在云端构建（本地无 release keystore）。
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # 生成 Release 说明需要上一个 tag 到本次的完整历史
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'

      # 准备 release 签名：优先用 secrets.KEYSTORE_BASE64；若未配置（fork 不继承父仓库 secrets）
      # 则现场生成一次性 PKCS12 keystore，避免空文件导致“Tag number over 30”。
      - name: 准备 release 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          F="$GITHUB_WORKSPACE/release.keystore"
          SP="${KEYSTORE_PASSWORD:-aigw-release-pass}"
          AL="${KEY_ALIAS:-androidrelease}"
          KP="${KEY_PASSWORD:-$SP}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$F"
          else
            echo "secrets.KEYSTORE_BASE64 未配置，现场生成一次性 PKCS12 keystore"
            rm -f "$F"
            keytool -genkeypair -v -keystore "$F" -storetype PKCS12 \
              -storepass "$SP" -keypass "$KP" -alias "$AL" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AI Gateway, O=AI Gateway, C=US"
          fi
          keytool -list -keystore "$F" -storepass "$SP" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=$F
          storePassword=$SP
          keyAlias=$AL
          keyPassword=$KP
          EOF

      - name: 静态检查
        run: gradle :core:detekt --console=plain

      - name: 单元测试
        run: gradle :core:test :app:testReleaseUnitTest --console=plain

      - name: 打包 release
        run: gradle :app:assembleRelease --console=plain

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION"

      - name: 生成更新日志（仅应用相关变化）
        id: changelog
        run: |
          # 只汇总影响应用的改动（app/ 与 core/），CI、脚本、文档等非应用变化不进日志。
          # 版本号提交（chore(release)）只改 build.gradle.kts，不属于可感知的功能变化，单独排除。
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^v${{ steps.version.outputs.version }}$" | head -n1)
          RANGE="HEAD"
          [ -n "$PREV_TAG" ] && RANGE="$PREV_TAG..HEAD"
          LOG=$(git log $RANGE --no-merges --invert-grep --grep='^chore(release)' --pretty='- %s' -- app core)
          [ -n "$LOG" ] || LOG="- 无应用相关变化"
          {
            echo "body<<CHANGELOG_EOF"
            echo "## 更新内容（${PREV_TAG:-首次发布} → v${{ steps.version.outputs.version }}）"
            echo ""
            echo "$LOG"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: 重命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "ai-gateway-${{ steps.version.outputs.version }}-release.apk"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          # 不指定时 GitHub 会把 tag 建在默认分支顶端，导致从分支发版时 tag 指向的代码与产物不符。
          target_commitish: ${{ github.sha }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          files: ai-gateway-${{ steps.version.outputs.version }}-release.apk
