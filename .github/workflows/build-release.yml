name: Build Release APK

# 仅构建、不发版：手动触发，跑测试 + 打 release 包，产物以 artifact 形式保留。
# 用于实机测试 release 包；需要正式发版时用 android-release.yml（会创建 Release 与 tag）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.1'

      # 准备 release 签名与 keystore.properties：
      #   优先用 secrets 里的真 keystore（KEYSTORE_BASE64）；
      #   若该 secret 未配置（例如 fork 出来的仓库不继承父仓库 secrets，
      #   base64 -d 会得到 0 字节空文件，进而触发 “Tag number over 30”），
      #   则用 CI 自带 keytool 现场生成一个一次性签名，保证能打出可安装的 release 包。
      - name: 准备 release 签名
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          F="$GITHUB_WORKSPACE/release.keystore"
          # secrets 为空时给一套确定性的默认值（仅用于自测包，非正式发版）
          SP="${KEYSTORE_PASSWORD:-aigw-release-pass}"
          AL="${KEY_ALIAS:-androidrelease}"
          KP="${KEY_PASSWORD:-$SP}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "使用 secrets.KEYSTORE_BASE64 还原 keystore"
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$F"
          else
            echo "secrets.KEYSTORE_BASE64 未配置，现场生成一次性 PKCS12 keystore"
            rm -f "$F"
            keytool -genkeypair -v -keystore "$F" -storetype PKCS12 \
              -storepass "$SP" -keypass "$KP" -alias "$AL" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AI Gateway, O=AI Gateway, C=US"
          fi
          # 校验 keystore 可用
          keytool -list -keystore "$F" -storepass "$SP" >/dev/null
          cat > keystore.properties <<EOF
          storeFile=$F
          storePassword=$SP
          keyAlias=$AL
          keyPassword=$KP
          EOF
          echo "keystore.properties:"; cat keystore.properties

      - name: 静态检查
        run: gradle :core:detekt --console=plain

      - name: 单元测试
        run: gradle :core:test :app:testReleaseUnitTest --console=plain

      - name: 打包 release
        run: gradle :app:assembleRelease --console=plain

      - name: 读取版本号
        id: version
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "本次版本：$VERSION"

      - name: 重命名产物
        run: cp app/build/outputs/apk/release/app-release.apk "ai-gateway-${{ steps.version.outputs.version }}-release.apk"

      - name: 上传 APK（artifact，不创建 Release）
        uses: actions/upload-artifact@v7
        with:
          name: ai-gateway-${{ steps.version.outputs.version }}-release
          path: ai-gateway-${{ steps.version.outputs.version }}-release.apk
          retention-days: 14
